name: vs-check
on:
  push:
    branches: [vs-check]
jobs:
  release-step:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test and pack the extension (as in release.yml)
        shell: pwsh
        working-directory: contrib/visualstudio
        env:
          TAG: '2.1.0'
        run: |
          $version = $env:TAG -replace '^v', ''
          $properties = @('-c', 'Release')
          if ($version -match '^\d+(\.\d+){1,3}$') { $properties += "-p:Version=$version" }
          dotnet test @properties
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vsix = "orangu-$env:TAG-visualstudio.vsix"
          Copy-Item Orangu.VisualStudio\bin\Release\net8.0-windows8.0\Orangu.VisualStudio.vsix "..\..\$vsix"
          "VSIX=$vsix" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Check the package
        shell: pwsh
        run: |
          "VSIX=$env:VSIX"
          Get-Item $env:VSIX | Format-List Name,Length
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:VSIX))
          $entry = $zip.GetEntry('extension.vsixmanifest')
          $reader = New-Object IO.StreamReader($entry.Open())
          $manifest = $reader.ReadToEnd(); $reader.Dispose(); $zip.Dispose()
          ($manifest -split "`n") | Select-String -Pattern 'Identity|InstallationTarget '
          if ($manifest -notmatch 'Version="2\.1\.0') { throw "version not in manifest" }
